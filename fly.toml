# fly.toml app configuration file generated for salarymanagement on 2026-11-22T16:31:46Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'salarymanagement'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  RAILS_ENV = 'production'

[[mounts]]
  source = 'salary_management_data'
  destination = '/rails/storage'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
